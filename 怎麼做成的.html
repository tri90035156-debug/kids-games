<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>怎麼做成的</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="給 6 歲小朋友的注音互動遊戲：用手拖一拖、按一按，做出一間房子，也做出身邊的鉛筆、紙、玻璃杯。各十關，可以唸給你聽。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 版面：手機一欄（上面黏著圓形舞台、下面文字卡片）；寬螢幕左舞台右卡片。配色取自臺南 LOGO：紅、酒紅、金、米白 */
:root{
  --bg:#FBF7F1; --ink:#2A2020; --ink2:#5A4E48; --mute:#8A7A70; --line:#E8DDCB;
  --red:#DB2E27; --wine:#6C2024; --gold:#BD9558; --halo:#F3E8D6; --good:#3F6B2E;
  --zy:#6C2024;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:20px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto}
[hidden]{display:none!important}

/* ---------- 注音：直排在字的右邊（一用原調，不變調） ---------- */
.zc{display:inline-flex;align-items:center;vertical-align:middle;margin-block:.08em}
.zh{line-height:1.12}
.zy{display:inline-flex;align-items:center;position:relative;margin-left:.04em;font-size:.46em;font-weight:500;color:var(--zy);font-family:var(--sans)}
.zy.has-t{padding-right:.4em}
.zs{display:flex;flex-direction:column;align-items:center}
.zs i{font-style:normal;line-height:1.04;display:block}
.tn{position:absolute;right:0;top:50%;transform:translateY(-64%);font-weight:700;line-height:1}
.tl{position:absolute;left:50%;top:-.78em;transform:translateX(-50%);font-weight:700;line-height:1}
.nb{white-space:nowrap}
.b .zh{font-weight:900}
.b .zh{color:var(--ink)}
body.nozy .zy{display:none}
.on-red .zy,.on-red{color:#fff}
.on-red .zy{color:#fff}

/* ---------- 封面 ---------- */
.cover{max-width:760px;margin:0 auto;padding-block:14px 30px;text-align:center}
.cover .tools{display:flex;justify-content:flex-end}
.logo{width:76px;height:76px;border-radius:50%;background:var(--red);margin:10px auto 6px;display:grid;place-items:center;box-shadow:0 0 0 6px var(--halo)}
.logo svg{width:46px;height:46px}
.cover h1{font-family:var(--serif);font-weight:900;font-size:46px;line-height:1.5;margin:6px 0 0;color:var(--ink)}
.cover .sub{font-family:var(--serif);font-weight:700;color:var(--wine);font-size:22px;margin:0 0 22px}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:30px 24px;margin-top:8px}
.pick{border:0;background:none;padding:0;cursor:pointer;display:grid;justify-items:center;gap:12px}
.pick .disc{width:min(72vw,280px);aspect-ratio:1;border-radius:50%;overflow:hidden;position:relative;
  box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--gold),0 0 0 16px var(--halo);transition:transform .15s}
.pick:active .disc{transform:scale(.97)}
.pick .disc svg{width:100%;height:100%;display:block}
.pick .nm{font-family:var(--serif);font-weight:900;font-size:26px;line-height:1.7;color:var(--ink)}
.pick .go{display:inline-flex;align-items:center;justify-content:center;background:var(--red);color:#fff;border-radius:999px;padding:2px 26px;font-family:var(--serif);font-weight:900;font-size:22px}
.pick .go .zy{color:#fff}

/* ---------- 遊戲頁 ---------- */
header{display:flex;align-items:center;gap:10px;padding-block:10px 4px}
.home{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--red);display:grid;place-items:center;cursor:pointer}
.home svg{width:24px;height:24px}
h1.gt{font-family:var(--sans);font-size:17px;font-weight:900;margin:0;flex:1 1 auto;min-width:0;line-height:1.3}
.tog{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;
  border-radius:999px;padding:6px 14px 6px 8px;font-family:var(--sans);font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.tog .sw{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .2s}
.tog .sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.tog[aria-pressed="true"] .sw{background:var(--red)}
.tog[aria-pressed="true"] .sw::after{left:16px}
.stamps{display:flex;gap:6px;justify-content:space-between;max-width:520px;padding-block:6px 8px}
.stamps button{flex:1 1 0;min-width:0;max-width:44px;aspect-ratio:1;border-radius:50%;border:2px dashed var(--gold);background:none;padding:0;display:grid;place-items:center;cursor:pointer}
.stamps button svg{width:70%;height:70%;opacity:0}
.stamps button.got{background:var(--red);border:2px solid var(--red)}
.stamps button.got svg{opacity:1}
.stamps button.now{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--gold)}
.stamps button.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

main{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.stagew{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px 14px}
.stage{position:relative;container-type:inline-size;width:min(100%,46vh,520px);aspect-ratio:1;margin:0 auto;border-radius:50%;overflow:hidden;background:#D9EEF7;
  box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--gold),0 0 0 15px var(--halo);touch-action:none;user-select:none;-webkit-user-select:none}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.stage.shk{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
#lays{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-weight:900;font-size:5.6cqw;line-height:1.2;
  background:rgba(255,255,255,.92);border-radius:999px;padding:.08em .55em;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18);animation:fadein .35s both}
.lab.dark{background:rgba(42,32,32,.82);color:#fff}
.lab.dark .zy{color:#fff}
@keyframes fadein{from{opacity:0;transform:translate(-50%,-50%) scale(.8)}to{opacity:1}}
.stage svg .hit{cursor:pointer}

.card{min-width:0;padding-block:2px 20px}
.row1{display:flex;align-items:center;gap:10px;justify-content:space-between}
.kick{color:var(--red);font-family:var(--serif);font-weight:900;font-size:18px;margin:0}
.read{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;border-radius:999px;
  padding:4px 14px 4px 10px;min-height:44px;font-family:var(--sans);font-weight:700;font-size:15px;cursor:pointer;flex:none}
.read svg{width:22px;height:22px}
.read[aria-pressed="true"]{border-color:var(--red);color:var(--red)}
h2{font-family:var(--serif);font-size:30px;line-height:1.5;margin:2px 0 8px;font-weight:900;text-wrap:balance}
.story p{margin:0 0 4px;color:var(--ink2);font-size:21px;line-height:2}
.task{margin:10px 0 0;font-size:22px;font-weight:900;color:var(--wine);line-height:2}
.task .zh{font-weight:900}
.ctrl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:12px}
.ctrl:empty{display:none}
.say{margin:10px 0 0;font-size:21px;line-height:2}
.say.ok{color:var(--good)}
.say.again{color:var(--red)}
.say.info{color:var(--ink)}
.say.again::before{content:"再試試　";font-weight:900}
.say .b .zh{font-weight:900}

.big{width:100px;height:100px;border-radius:50%;border:0;background:var(--red);color:#fff;font-family:var(--serif);font-weight:900;
  font-size:21px;line-height:1.3;cursor:pointer;box-shadow:0 0 0 7px rgba(243,232,214,.95);display:grid;place-items:center;text-align:center;padding:6px;
  touch-action:none;user-select:none;-webkit-user-select:none}
.big.alt{background:var(--wine)}
.big:active,.big.held{transform:scale(.94)}
.big:disabled{opacity:.4}
.big .zy{color:#fff}
.whyb{margin-top:14px;background:none;border:0;padding:4px 0;font-family:var(--serif);font-weight:900;font-size:22px;color:var(--wine);
  text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:3px;text-underline-offset:6px;cursor:pointer;min-height:44px}
.whyc p{margin:6px 0;font-size:20px;line-height:2;color:var(--ink2)}
.small{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;line-height:1.7;color:var(--mute)}
.small p{margin:0 0 6px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(251,247,241,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav{min-height:52px;padding:6px 22px;border-radius:999px;border:2px solid var(--line);background:#fff;font-family:var(--serif);font-weight:900;font-size:19px;cursor:pointer}
.nav.go{background:var(--red);border-color:var(--red);color:#fff}
.nav.go .zy{color:#fff}
.nav:disabled{opacity:.35;cursor:not-allowed}
.pos{font-weight:700;color:var(--mute);font-size:15px;font-variant-numeric:tabular-nums}
.enter>*{animation:up .5s both}
.enter>*:nth-child(2){animation-delay:.06s}.enter>*:nth-child(3){animation-delay:.12s}.enter>*:nth-child(4){animation-delay:.18s}
@keyframes up{from{transform:translateY(10px);opacity:.01}to{transform:none;opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-6%;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(600deg)}}
@media (prefers-reduced-motion:reduce){.enter>*{animation:none}.stage.shk{animation:none}.confetti{display:none}}
@media (min-width:860px){
  body{font-size:21px}
  .cover h1{font-size:60px}
  main{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start;gap:34px}
  .stagew{top:16px;padding:6px 8px}
  .stage{width:min(100%,calc(100vh - 230px),560px)}
  h2{font-size:34px}
  h1.gt{font-size:20px}
}
</style>

<div class="wrap" id="app">
  <section class="cover" id="cover">
    <div class="tools"><button class="tog" id="zyb0" aria-pressed="true"><span class="sw"></span><span id="zyl0"></span></button></div>
    <div class="logo"><svg viewBox="-12 -12 24 24" aria-hidden="true" id="logoI"></svg></div>
    <h1 id="ct"></h1>
    <p class="sub" id="cs"></p>
    <div class="picks" id="picks"></div>
    <div class="small"><p id="cn"></p></div>
  </section>
  <section id="play" hidden>
    <header>
      <button class="home" id="homeb" aria-label="回首頁"></button>
      <h1 class="gt" id="gt"></h1>
      <button class="tog" id="zyb" aria-pressed="true"><span class="sw"></span><span id="zyl"></span></button>
    </header>
    <nav class="stamps" id="stamps" aria-label="十關"></nav>
    <main>
      <div class="stagew"><div class="stage" id="stage"><svg id="sv" viewBox="0 0 320 320" role="img" aria-label="互動圖"></svg><div id="lays"></div></div></div>
      <article class="card" id="card">
        <div class="enter" id="enter">
          <div class="row1"><p class="kick" id="kick"></p><button class="read" id="rd" aria-pressed="false"></button></div>
          <h2 id="ttl"></h2>
          <div class="story" id="story"></div>
          <p class="task" id="task"></p>
        </div>
        <div class="ctrl" id="ctrl"></div>
        <p class="say" id="say"></p>
        <div id="whyw"></div>
        <div class="small" id="small"></div>
      </article>
    </main>
    <nav class="bar"><div class="in">
      <button class="nav" id="prev"></button><span class="pos" id="pos"></span><button class="nav go" id="next"></button>
    </div></nav>
  </section>
</div>

<script>

var RE=/([㐀-鿿])\[([^\]]+)\]|([\s\S])/gu, CLOSE='，。！？、：；」』）', OPEN='「『（';
function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function cell(ch,zy,bold){
  var h='<span class="zc'+(bold?' b':'')+'"><span class="zh">'+esc(ch)+'</span>';
  if(zy){
    var light=zy.charAt(0)==='˙',s=light?zy.slice(1):zy,tn='',last=s.charAt(s.length-1);
    if('ˊˇˋ'.indexOf(last)>=0){tn=last;s=s.slice(0,-1);}
    h+='<span class="zy'+(tn?' has-t':'')+'">'+(light?'<b class="tl">˙</b>':'')+'<span class="zs">'+Array.from(s).map(function(c){return '<i>'+c+'</i>';}).join('')+'</span>'+(tn?'<b class="tn">'+tn+'</b>':'')+'</span>';
  }
  return h+'</span>';
}
function Z(m){
  var cells=[],pend='',bold=false;
  m.replace(RE,function(a,c,zy,o){
    var ch=c||o;
    if(ch==='\u0001'){bold=true;return a;} if(ch==='\u0002'){bold=false;return a;}
    if(!c&&ch===' '){cells.push({sp:1});return a;}
    var it=cell(ch,c?zy:'',bold);
    if(CLOSE.indexOf(ch)>=0&&cells.length&&!cells[cells.length-1].sp){cells[cells.length-1].h+=it;return a;}
    if(pend){it=pend+it;pend='';}
    if(OPEN.indexOf(ch)>=0){pend=it;return a;}
    cells.push({h:it});return a;
  });
  return cells.map(function(c){return c.sp?' ':'<span class="nb">'+c.h+'</span>';}).join('');
}
function plain(m){return m.replace(/\[[^\]]*\]/g,'').replace(/[\u0001\u0002「」]/g,'');}

  g.addEventListener('pointerdown',function(e){
    if(g._lock)return;e.preventDefault();var p=pt(e),dx=g._x-p.x,dy=g._y-p.y;g.parentNode.appendChild(g);g._drag=true;cb.down&&cb.down(g);

    function up(){window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);g._drag=false;cb.up&&cb.up(g._x,g._y,g);}
    window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  });
}

  stopRead();var u=new SpeechSynthesisUtterance(txt);u.lang='zh-TW';u.rate=.8;u.pitch=1.1;var v=voice();if(v)u.voice=v;
  u.onend=function(){reading=false;rdBtn();};reading=true;rdBtn();try{speechSynthesis.speak(u);}catch(e){reading=false;rdBtn();}
}
