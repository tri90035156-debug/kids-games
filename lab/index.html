<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>實驗室</title>
<meta name="description" content="每天晚上自動做出來、還在打磨的新遊戲。家長先試玩，覺得好再搬到首頁。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
  :root { --bg:#F7F0E4; --paper:#FFF8EE; --ink:#3B3430; --sage:#6F9A72; --wood:#D9B27A; --deep:#B98E5A; --coral:#F05A3C; --amber:#F2A33A; --green:#4CB05A; --blue:#3C9BE0; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans TC", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  body { min-height:100vh; padding:28px 16px 60px; }
  header { max-width:980px; margin:0 auto 22px; display:flex; align-items:center; gap:14px; }
  .back { width:46px; height:46px; border-radius:50%; background:var(--paper); display:grid; place-items:center; color:var(--deep); box-shadow:0 4px 14px rgba(90,60,20,.10); text-decoration:none; flex:0 0 auto; }
  h1 { font-family:"Noto Serif TC", serif; font-weight:900; font-size:clamp(26px,4vw,36px); margin:0; letter-spacing:.04em; }
  .note { max-width:980px; margin:0 auto 26px; color:#6b625b; font-size:15px; line-height:1.7; }
  .grid { max-width:980px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr)); gap:18px; }
  .card { background:var(--paper); border-radius:22px; padding:22px 22px 20px; text-decoration:none; color:inherit; box-shadow:0 10px 30px rgba(90,60,20,.08); position:relative; transition:transform .24s cubic-bezier(.34,1.56,.64,1), box-shadow .24s; display:block; }
  .card:hover { transform:translateY(-3px) scale(1.01); box-shadow:0 16px 36px rgba(90,60,20,.13); }
  .card:active { transform:scale(.97); }
  .badge { width:64px; height:64px; border-radius:50%; display:grid; place-items:center; margin-bottom:14px; background:var(--c, var(--sage)); color:#fff; font-family:"Noto Serif TC", serif; font-weight:900; font-size:26px; box-shadow:inset 0 -6px 0 rgba(0,0,0,.08); }
  .name { font-family:"Noto Serif TC", serif; font-weight:900; font-size:22px; margin:0 0 4px; }
  .sub { margin:0 0 12px; color:#6b625b; font-size:14px; }
  .status { display:inline-block; font-size:12px; padding:4px 10px; border-radius:999px; background:#F3E8D6; color:#7a5a2a; margin-bottom:10px; }
  .status.ok { background:#EDF3E6; color:#3F6B2E; }
  .sum { font-size:14px; line-height:1.65; margin:0; color:#4a423d; }
  .meta { margin-top:12px; font-size:12px; color:#9a9089; }
  .empty { max-width:980px; margin:40px auto; text-align:center; color:#8a807a; line-height:1.9; }
</style>
</head>
<body>
<header>
  <a class="back" href="../" aria-label="回到所有遊戲"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14l2-5h11l3 5v4H3z"/><path d="M7 9V6h7l2 3"/><circle cx="7" cy="18" r="1.6" fill="currentColor"/><circle cx="17" cy="18" r="1.6" fill="currentColor"/></svg></a>
  <h1>實驗室</h1>
</header>
<p class="note">這裡是每天晚上自動做出來、還在打磨的新遊戲。家長先陪孩子試玩；覺得夠好了，再搬到首頁。每晚的評審報告在 <code>pipeline/reports/</code>。</p>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden>還沒有實驗中的遊戲。<br>第一個晚上跑完，這裡就會出現。</div>
<script>
(async () => {
  const COLORS = ['#F05A3C', '#4CB05A', '#3C9BE0', '#F2A33A', '#8B6FD6', '#6F9A72'];
  let games = [];
  try { games = await fetch('games.json', { cache: 'no-store' }).then(r => r.json()); } catch (e) {}
  const grid = document.getElementById('grid');
  if (!games.length) { document.getElementById('empty').hidden = false; return; }
  grid.innerHTML = games.map((g, i) => `
    <a class="card" href="${g.dir}/" style="--c:${COLORS[i % COLORS.length]}">
      <div class="badge">${(g.name || '?').slice(0, 1)}</div>
      <p class="name">${g.name || g.dir}</p>
      <p class="sub">${g.sub || ''}</p>
      <span class="status ${g.status === '可以上架' ? 'ok' : ''}">${g.status || '試作中'}</span>
      <p class="sum">${g.summary || '今晚剛做好，還沒有評語。'}</p>
      <div class="meta">${g.nights ? '第 ' + g.nights + ' 晚' : ''}${g.updated ? '　更新 ' + g.updated : ''}</div>
    </a>`).join('');
})();
</script>
</body>
</html>
